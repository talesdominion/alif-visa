name: android-build
on:
  push:
    branches: [android-app]
    paths-ignore: ['.github/workflows/assets.yml', 'store/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build
        run: |
          mkdir -p out
          set -o pipefail
          gradle --no-daemon :app:assembleDebug :app:bundleRelease 2>&1 | tee out/build.log
          cp app/build/outputs/apk/debug/app-debug.apk out/
          cp app/build/outputs/bundle/release/app-release.aab out/app-release-unsigned.aab
          cp app/build/outputs/mapping/release/mapping.txt out/ 2>/dev/null || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator test
        timeout-minutes: 20
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 576M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-test.sh
      - name: Publish outputs
        if: always()
        run: |
          mkdir -p out
          cd out
          git init -q
          git config user.name build-bot
          git config user.email build-bot@users.noreply.github.com
          git checkout -q -b build-output-${{ matrix.api }}
          git add -A
          git commit -qm "build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-output-${{ matrix.api }}
