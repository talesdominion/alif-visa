name: site-check
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch apply page as desktop, phone and app
        run: |
          U='https://alifvisa.com/apply/?from=GB&to=FR&purpose=tourism&type=visit-visa'
          D='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          M='Mozilla/5.0 (Linux; Android 15; sdk_gphone64_x86_64 Build/AE3A.240806.005; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/124.0.6367.219 Mobile Safari/537.36'
          A="$M AlifVisaApp/3.0.1 (Android)"
          for n in desktop phone app; do
            case $n in desktop) ua="$D";; phone) ua="$M";; app) ua="$A";; esac
            curl -s -D h_$n.txt -A "$ua" "$U" -o p_$n.html
            echo "== $n: size $(wc -c < p_$n.html) guided=$(grep -c 'alif-gx-js' p_$n.html) v41=$(grep -c 'restoreSaved' p_$n.html) wizard=$(grep -c 'alif-apply-wizard' p_$n.html)"
            grep -i -E '^(x-litespeed|x-lsadc|vary|cache-control|x-qc)' h_$n.txt
            grep -o 'Page generated by LiteSpeed Cache[^>]*' p_$n.html | head -1
          done
